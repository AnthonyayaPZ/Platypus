# Optional: install only after the operator supplies a YouTube-only cookie file.
# The original stays root-only outside the source checkout. systemd exposes a
# read-only credential copy; each yt-dlp request uses its own temporary copy.
[Service]
LoadCredential=youtube.cookies:/etc/platypus-secrets/youtube.cookies.txt
Environment=CAPTIONS_COOKIES_FILE=%d/youtube.cookies
